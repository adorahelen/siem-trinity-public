services:
  trinitysoc:
    image: nginx:1.27-alpine
    container_name: trinitysoc
    restart: unless-stopped
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:5173:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - detection
      - intelligence
    environment:
      TZ: Asia/Seoul

networks:
  detection:
    external: true
    name: 02-detection_siem-internal
  intelligence:
    external: true
    name: 03-intelligence_intelligence-internal
