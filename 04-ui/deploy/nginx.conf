map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: 모든 경로 → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/llm/ → LLM 호출 (CPU 추론 30~120초 소요). 일반 /api/ 보다 먼저 와야 매칭됨.
    location /api/llm/ {
        proxy_pass http://detection-api:8000/api/llm/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # /api → SIEM-Trinity detection-api
    location /api/ {
        proxy_pass http://detection-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # /_detector/ → siem-ai-detector React UI (iframe 임베드용)
    location /_detector/ {
        proxy_pass http://detection-api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        sub_filter_once off;
        sub_filter_types text/html;
        sub_filter 'href="/' 'href="/_detector/';
        sub_filter 'src="/' 'src="/_detector/';
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
