# XDR 단계 2b — fail2ban 실제 차단 인프라 오버레이.
#
# 사용:
#   호스트에 fail2ban + siem-trinity jail 설정 완료 후
#   docker compose -f docker-compose.yml -f docker-compose.fail2ban.override.yml up -d
#
# AUTO_BAN_ENABLED 활성화는 별도 절차 (운영자 자기 차단 = 1순위 리스크 — CLAUDE.md §5.3).
# 1주일 dry-run 관찰 후 .env 에 AUTO_BAN_ENABLED=true 설정.
#
# 자세한 절차는 docs/xdr-step2-auto-ban.md §F 참고.
services:
  detection-api:
    volumes:
      - /var/run/fail2ban/fail2ban.sock:/var/run/fail2ban/fail2ban.sock
