<ossec_config>

  <global>
    <jsonout_output>yes</jsonout_output>
    <alerts_log>yes</alerts_log>
    <logall>no</logall>
    <logall_json>no</logall_json>
    <email_notification>no</email_notification>

    <!-- XDR 단계 3: active-response 화이트리스트 -->
    <!-- Tailscale CGNAT (100.64.0.0/10): 운영자 자기 차단 방지 (CLAUDE.md §5.3) -->
    <white_list>100.64.0.0/10</white_list>
    <!-- 사설망 -->
    <white_list>10.0.0.0/8</white_list>
    <white_list>192.168.0.0/16</white_list>
    <white_list>172.16.0.0/12</white_list>
    <!-- 로컬호스트 -->
    <white_list>127.0.0.1</white_list>
  </global>

  <alerts>
    <log_alert_level>3</log_alert_level>
    <email_alert_level>12</email_alert_level>
  </alerts>

  <!-- 에이전트 수신 설정 -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
  </remote>

  <!-- 파일 무결성 모니터링 (FIM) - 핵심 경로 -->
  <syscheck>
    <frequency>3600</frequency>
    <alert_new_files>yes</alert_new_files>

    <!-- 모니터링 대상 -->
    <directories check_all="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/sudoers</directories>
    <directories check_all="yes" report_changes="yes">/etc/ssh/sshd_config</directories>
    <directories check_all="yes">/etc/nginx</directories>
    <!-- SIEM-Trinity 설정 디렉터리 FIM (Wazuh agent 활성화 후 의미 있음) -->
    <!-- 사용자가 호스트에 SIEM-Trinity를 어디 둔지에 따라 수정. 예: /opt/SIEM-Trinity/01-collection/config -->
    <!-- <directories check_all="yes">/path/to/SIEM-Trinity/01-collection/config</directories> -->

    <directories check_all="yes">/usr/bin,/usr/sbin</directories>

    <!-- 제외 경로 -->
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
    <ignore>/tmp</ignore>
  </syscheck>

  <!-- 프로세스 이상 탐지 -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
  </rootcheck>

  <!-- 로그 수집 (에이전트에서도 수집하지만 매니저에서도 분석) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/ossec/logs/active-responses.log</location>
  </localfile>

  <!-- ──────────────────────────────────────────────────────────── -->
  <!-- XDR 단계 3: Active Response (기본 비활성, 활성화 절차는 docs/xdr-step3-active-response.md) -->
  <!--                                                              -->
  <!-- ⚠ 활성화 전 필수 확인:                                       -->
  <!--   1. 위 <white_list> 에 운영자 접속 IP 대역 포함 여부         -->
  <!--   2. <rules_id> 가 실제 환경의 alert 와 일치하는지 검증       -->
  <!--   3. 1주일 dry-run (log-only 모드) 관찰 후 활성화             -->
  <!--                                                              -->
  <!-- 활성화 절차: 아래 4줄 주석 (<!- - 와 - ->) 을 모두 제거하고  -->
  <!--             docker compose -f docker-compose.yml restart wazuh-manager -->

  <!--
  <active-response>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5712,5763,40111,31151,31153</rules_id>
    <timeout>600</timeout>
  </active-response>
  -->

</ossec_config>
