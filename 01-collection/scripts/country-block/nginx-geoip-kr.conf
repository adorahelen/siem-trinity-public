# =============================================================================
# nginx GeoIP2 기반 대한민국 외 HTTP/HTTPS 차단 설정
# ipset 차단(L3)과 함께 사용하면 이중 보호
#
# 사전 조건:
#   sudo apt install -y libnginx-mod-http-geoip2 libmaxminddb0 libmaxminddb-dev
#   sudo apt install -y mmdb-bin
#   # MaxMind 계정 없이 사용 가능한 대안: db-ip.com
#   wget -O /etc/nginx/geoip/dbip-country-lite.mmdb \
#     https://download.db-ip.com/free/dbip-country-lite-$(date +%Y-%m).mmdb.gz
#   # 또는 MaxMind GeoLite2 (무료, 등록 필요)
# =============================================================================

# ── /etc/nginx/nginx.conf 의 http {} 블록 안에 추가 ────────────────────────

# GeoIP2 DB 경로 (db-ip 무료 버전 기준)
geoip2 /etc/nginx/geoip/dbip-country-lite.mmdb {
    auto_reload 5m;
    $geoip2_country_code default=XX country iso_code;
}

# KR이 아니면 차단 플래그 설정
map $geoip2_country_code $allow_country {
    default   0;  # 기본: 차단
    KR        1;  # 대한민국: 허용
    ~^$       1;  # 국가 코드 미확인 (내부망): 허용
}

# ── 각 server {} 블록 안에 추가 ──────────────────────────────────────────

# 예시: kangminlog 설정 파일에 추가
server {
    # ... 기존 설정 ...

    # GeoIP 차단 (Tailscale 내부 요청은 country 코드가 없어 허용됨)
    if ($allow_country = 0) {
        return 444;  # 연결 즉시 종료 (응답 없음), 403보다 스텔스
    }

    # 또는 403 반환하려면:
    # if ($allow_country = 0) {
    #     return 403 "Access denied: Korean IPs only.";
    # }
}
